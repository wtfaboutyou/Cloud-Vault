# ---------------------------------------------------------------------------
# CloudVault - Prometheus alert rules
# Location: /etc/prometheus/alert.rules.yml
# Dispatched via Alertmanager -> Grafana notifications.
# ---------------------------------------------------------------------------
groups:
  - name: cloudvault-infra
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"

      - alert: InstanceDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter unreachable"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 90% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 85% on {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space below 15% on {{ $labels.mountpoint }}"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) * 100 < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space below 5% on {{ $labels.mountpoint }}"

      - alert: RedisConnectionErrors
        expr: rate(redis_connected_clients[5m]) == 0 and (redis_connected_clients < 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis has no connected clients"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag above 30s"

  - name: cloudvault-security
    rules:
      - alert: ActiveBannedIPsHigh
        expr: cloudvault_fail2ban_active_bans > 5
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High number of currently-banned IPs ({{ $value }})"

      - alert: TotalBansSpike
        expr: increase(cloudvault_fail2ban_total_bans[15m]) > 10
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Fail2ban issued {{ $value }} new bans in the last 15m"

      - alert: HTTPRequestRateSpike
        expr: rate(nginx_http_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Spike in HTTP request rate (possible scraping/attack): {{ $value }} req/s"

      - alert: TCPConnectionsHigh
        expr: node_netstat_Tcp_CurrEstab > 500
        for: 10m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Unusually high number of established TCP connections ({{ $value }})"
