# ---------------------------------------------------------------------------
# CloudVault - PostgreSQL 17 tuning block
# Apply to /etc/postgresql/17/main/postgresql.conf
# Values are for 4-8 GB RAM on SSD/NVMe. Adjust proportionally:
#   shared_buffers       ~25% of RAM
#   effective_cache_size ~75% of RAM
#   4GB RAM  -> 1GB / 3GB    8GB -> 2GB / 6GB    16GB -> 4GB / 12GB
# ---------------------------------------------------------------------------

# ---- Memory ----
shared_buffers = 1GB                    # 25% of total RAM
effective_cache_size = 3GB            # 75% of total RAM
work_mem = 16MB                       # per-session sort/hash memory
maintenance_work_mem = 256MB          # autovacuum / index rebuild
huge_pages = try

# ---- WAL ----
wal_buffers = 16MB
synchronous_commit = off              # perf trade-off (acceptable for sync of files)
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# ---- Connections ----
max_connections = 200

# ---- Planner / disk ----
random_page_cost = 1.1               # SSD/NVMe
effective_io_concurrency = 200       # NVMe
default_statistics_target = 200

# ---- Autovacuum ----
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2