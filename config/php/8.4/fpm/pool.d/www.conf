# ---------------------------------------------------------------------------
# CloudVault - PHP-FPM pool configuration
# Location: /etc/php/8.4/fpm/pool.d/www.conf
# Tuned for a 4 vCPU / 8-16 GB RAM Nextcloud + ClamAV workload.
# ---------------------------------------------------------------------------
[www]

user = www-data
group = www-data

listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

# ---- process manager ----
pm = dynamic
pm.max_children = 100
pm.start_servers = 10
pm.min_spare_servers = 8
pm.max_spare_servers = 20
pm.max_requests = 2000

# ---- resource limits per PHP-FPM worker ----
request_terminate_timeout = 300
request_slowlog_timeout = 5s
slowlog = /var/log/php8.4-fpm-slow.log

# ---- environment ----
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

# ---- security ----
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.4-fpm.log
php_admin_value[upload_max_filesize] = 10G
php_admin_value[post_max_size] = 11G
php_admin_value[upload_tmp_dir] = /var/lib/nginx/body  # uploads spooled on fast disk
php_value[realpath_cache_size] = 4096k
php_value[realpath_cache_ttl] = 600

# Nextcloud recommended php.ini values
php_value[date.timezone] = Etc/UTC
php_value[memory_limit] = 1G
php_value[max_execution_time] = 300
php_value[max_input_vars] = 5000
php_value[opcache.enable] = 1
php_value[opcache.memory_consumption] = 256
php_value[opcache.interned_strings_buffer] = 16
php_value[opcache.max_accelerated_files] = 20000
php_value[opcache.revalidate_freq] = 60
php_value[opcache.validate_timestamps] = 1
php_value[opcache.jit] = tracing
php_value[opcache.jit_buffer_size] = 100M

php_value[always_populate_raw_post_data] = -1