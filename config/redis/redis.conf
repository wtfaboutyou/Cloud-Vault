# ---------------------------------------------------------------------------
# CloudVault - Redis 7 hardening
# Apply to /etc/redis/redis.conf (uncomment/override values)
# ---------------------------------------------------------------------------

# ---- network: loopback only ----
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 511

# ---- auth ----
# requirepass <REDIS_PASSWORD>        # set by install.sh (stored in config.php)

# ---- dangerous commands disabled ----
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SHUTDOWN ""
# rename-command CONFIG ""

# ---- memory management ----
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ---- persistence ----
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# ---- misc hardening ----
supervised systemd
databases 16