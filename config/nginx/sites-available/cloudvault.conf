# ---------------------------------------------------------------------------
# CloudVault - Nextcloud reverse proxy vhost
# Location: /etc/nginx/sites-available/cloudvault.conf
#           symlink -> /etc/nginx/sites-enabled/cloudvault.conf
#
# Only server{} blocks here; global tuning lives in /etc/nginx/nginx.conf.
# Replace __NC_DOMAIN__ with your FQDN (install.sh does this automatically).
# ---------------------------------------------------------------------------

# ---- HTTP -> HTTPS redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name __NC_DOMAIN__;
    return 301 https://$host$request_uri;
}

# ---- HTTPS site ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name __NC_DOMAIN__;

    # ---- TLS 1.3/1.2 with OCSP stapling ----
    ssl_certificate     /etc/letsencrypt/live/__NC_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__NC_DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__NC_DOMAIN__/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;

    # ---- Security headers ----
    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options             "SAMEORIGIN";
    add_header X-Content-Type-Options      "nosniff";
    add_header X-XSS-Protection            "1; mode=block";
    add_header Referrer-Policy             "no-referrer-when-downgrade";
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()";
    add_header Content-Security-Policy     "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    root /var/www/nextcloud;
    index index.php;

    # ---- deny access to sensitive / protected paths ----
    location ~ ^/(build|tests|config|lib|3rdparty|templates|data|appdata)/ {
        deny all;
    }
    location ~ ^/(\.ht|\.user\.ini|\.env|\.git|\.svn|\.hg|\.DS_Store) {
        deny all;
    }

    # ---- well-known redirects for clients ----
    location = /.well-known/carddav { return 301 $scheme://$host/remote.php/dav; }
    location = /.well-known/caldav  { return 301 $scheme://$host/remote.php/dav; }
    location = /.well-known/webfinger { return 301 $scheme://$host/index.php/.well-known/webfinger; }

    # ---- main location ----
    location / {
        limit_req zone=generic burst=120 nodelay;
        try_files $uri $uri/ /index.php$request_uri;
    }

    # ---- PHP & WebDAV via FPM socket ----
    location ~ ^/(?:index|remote|public|cron|core/ajax/update|status|ocs/v[12]|updater/.+|ocs-provider/.+)\.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;

        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_pass php-handler;

        # keepalive relies on the upstream socket reuse at OS level
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
        fastcgi_max_temp_file_size 0;

        # stream large downloads from PHP without buffering the whole file in RAM
        fastcgi_buffering off;

        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
        fastcgi_connect_timeout 60;
    }

    # ---- demo login page (portfolio showcase, static) ----
    location ^~ /demo/ {
        alias /var/www/cloudvault-demo/;
        index index.html;
        limit_req zone=login burst=10 nodelay;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # Grafana reverse proxy (TLS secured)
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- login rate limit ----
    location = /login {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php$request_uri;
    }

    # ---- OTP registration: prevent bulk email-spam / account-create abuse ----
    location ~ ^/apps/otp-register/(send|verify)$ {
        limit_req zone=otp burst=3 nodelay;
        limit_rate 64k;
        try_files $uri /index.php$request_uri;
    }

    # ---- static assets with long cache ----
    location ~* \.(?:css|js|mjs|svg|woff2?|ttf|otf|eot|wasm|ico|jpg|jpeg|png|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
        access_log off;
        open_file_cache max=10000 inactive=5m;
        open_file_cache_valid 2m;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;
        sendfile on;
        tcp_nopush on;
    }

    # ---- error pages ----
    error_page 403 /core/templates/403.php;
    error_page 404 /core/templates/404.php;
    error_page 500 502 503 504 /core/templates/503.php;
}