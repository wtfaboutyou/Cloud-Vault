# ---------------------------------------------------------------------------
# CloudVault - Nginx main configuration
# Location: /etc/nginx/nginx.conf  (replaces the Debian default)
# ---------------------------------------------------------------------------
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ---- essentials ----
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;                     # hide nginx version
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- performance ----
    sendfile on;
    sendfile_max_chunk 1m;                 # avoid blocking a worker on huge downloads
    send_timeout 300s;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # ---- upload tuning (Nextcloud / WebDAV / chunked) ----
    client_max_body_size 10G;              # large upload buffering
    client_body_buffer_size 128k;          # keep small bodies in memory, not temp disk
    client_body_timeout 3600;              # allow slow/large uploads to finish
    client_header_timeout 60s;
    client_body_temp_path /var/lib/nginx/body 2 4;   # SSD-backed upload spool

    # ---- Brotli + Gzip (static/immutable assets) ----
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain text/css application/json application/javascript
        application/x-javascript text/xml application/xml application/xml+rss
        text/javascript application/vnd.ms-fontobject application/x-font-ttf
        font/opentype image/svg+xml image/x-icon application/wasm;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types
        text/plain text/css application/json application/javascript
        application/x-javascript text/xml application/xml application/xml+rss
        text/javascript image/svg+xml application/wasm;

    # ---- rate limiting zones ----
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=generic:10m rate=60r/m;
    limit_req_status 429;

    # ---- upstreams ----
    # keepalive reuse for the socket; fastcgi_keepalive (Nginx>=1.27) is not
    # available on the Debian 13 stock build (1.26.x), so OS socket reuse applies.
    upstream php-handler {
        server unix:/run/php/php8.4-fpm.sock;
        keepalive 32;
    }

    # ---- Nginx exporter status endpoint (loopback only) ----
    server {
        listen 127.0.0.1:9113;
        location /metrics {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }

    # ---- vhost includes ----
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}