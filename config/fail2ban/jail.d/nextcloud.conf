# ---------------------------------------------------------------------------
# CloudVault - Fail2ban jail definition
# Location: /etc/fail2ban/jail.d/nextcloud.conf
#
# Monitors both Nextcloud authentication log (nextcloud.log) and Nginx
# access/error logs for brute-force / credential-stuffing attempts and bans
# offenders via UFW.
# ---------------------------------------------------------------------------

[DEFAULT]
# add your trusted admin networks here, e.g. "127.0.0.1/8 203.0.113.0/24"
ignoreip = 127.0.0.1/8 ::1
banaction = ufw

[nextcloud]
enabled = true
port    = http,https
protocol = tcp
filter  = nextcloud
logpath = /var/www/nextcloud/data/nextcloud.log
maxretry = 5
findtime = 600
bantime  = 3600

[nginx-auth]
enabled = true
filter  = nginx-http-auth
logpath = /var/log/nginx/error.log
maxretry = 5
findtime = 300
bantime  = 3600

[nginx-botsearch]
enabled = true
filter  = nginx-botsearch
logpath = /var/log/nginx/access.log
maxretry = 10
findtime = 600
bantime  = 3600

[sshd]
enabled = true
port    = ssh
logpath = %(sshd_backend)s
maxretry = 5
findtime = 300
bantime  = 3600
