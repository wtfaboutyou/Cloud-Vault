# ---------------------------------------------------------------------------
# CloudVault - Fail2ban jail for Nextcloud
# Location: /etc/fail2ban/jail.d/nextcloud.conf
# ---------------------------------------------------------------------------

[Definition]
failregex = ^.*Login failed:.*(Remote IP: <HOST>|'REMOTE_ADDR' => '<HOST>').*$
            ^.*Trusted domain error.*"$.*<HOST>.*$
            ^.*"remoteAddr":"<HOST>"{0}.*"level":2.*"message":"Login failed:.*$
            ^.*"remoteAddr":"<HOST>".*Login failed:.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Unauthenticated request.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Attempt to access.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Could not authenticate.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Trusted domain error.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Password reset failed.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Registration not allowed.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Client sent an invalid request.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Login failed: user .* does not exist.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Login failed: The provided credentials are incorrect.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Login failed: authentication.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Login failed: username.*$
            ^.*"remoteAddr":"<HOST>".*"message":"Login failed:.*$

ignoreregex =