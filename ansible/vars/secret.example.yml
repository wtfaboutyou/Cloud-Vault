# Secret variables schema for CloudVault Ansible.
#
# NEVER commit real secrets. Copy to `inventory/group_vars/vault.yml` and
# encrypt with Ansible Vault:
#
#   ansible-vault create inventory/group_vars/vault.yml
#
# Fill in the values, then reference them from `all.yml` (they are merged
# automatically because Ansible auto-loads `vault.yml` + `yes, and extra_vas`).
#
# NOTE: vault.yml is gitignored (see repo .gitignore). Committing an
# unencrypted vault.yml is a security incident.

vault_cloudvault_admin_password: ""        # Nextcloud admin password (blank = auto-gen)
vault_cloudvault_db_password: ""           # PostgreSQL password for role `nextcloud`
vault_cloudvault_redis_password: ""        # Redis requirepass
vault_telegram_bot_token: ""               # Telegram @BotFather token
vault_telegram_chat_id: ""                 # Telegram chat id (e.g. -1001234567890)