---
# CloudVault idempotent update / maintenance.
#
# Refreshes the repo on the target and runs `install.sh update` — safe to
# re-run, never touches user data (no rewrite of config.php, no instance
# secret reset).
#
#   ansible-playbook playbooks/update.yml --ask-vault-pass
#
- name: CloudVault — update / maintenance
  hosts: cloudvault
  gather_facts: false
  tasks:
    - name: Ensure deploy dir exists
      ansible.builtin.file:
        path: "{{ cloudvault_deploy_dir }}"
        state: directory
        mode: '0755'

    - name: Fetch latest repo (when not using a local control-node copy)
      ansible.builtin.git:
        repo: "{{ cloudvault_repo_url }}"
        dest: "{{ cloudvault_deploy_dir }}"
        version: "{{ cloudvault_repo_version }}"
        force: true
      when: not cloudvault_repo_local

    - name: Run install.sh update (idempotent)
      ansible.builtin.command: "{{ cloudvault_bash }} scripts/install.sh update"
      args:
        chdir: "{{ cloudvault_deploy_dir }}"
      changed_when: true

    - name: Healthcheck after update
      ansible.builtin.command:
        cmd: "{{ cloudvault_bash }} {{ cloudvault_deploy_dir }}/scripts/healthcheck.sh"
      changed_when: false
      failed_when: false
      register: update_health

    - name: Show update healthcheck rc
      ansible.builtin.debug:
        var: update_health.rc