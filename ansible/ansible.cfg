# CloudVault Ansible configuration.
# Control node runs Ansible; targets are reached over SSH (agentless).
#
# Inventory: copy inventory/hosts.example.yml -> inventory/hosts.yml (gitignored)
# and fill in real hosts. Secrets go in Ansible Vault
# (inventory/group_vars/vault.yml, also gitignored).
[defaults]
inventory      = inventory/hosts.yml
roles_path     = ./roles
remote_user    = root
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
timeout        = 30

# Fail fast so a broken play never silently continues.
[privilege_escalation]
become = true
become_user = root

# Connection tuning for long installs (Nextcloud tarball ~300 MB).
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s
